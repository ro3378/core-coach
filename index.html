<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2314161B%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2218%22 fill=%22%23FF8A4C%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="核心訓練">
<title>核心訓練 Core Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161B; --panel:#1E2128; --line:#2D313A; --text:#F2F0EA; --mute:#9AA0AB;
  --accent:#FF8A4C; --accent2:#FFC24C; --ok:#5BD49A; --card:#F3EFE6;
  --l1:#5BD49A; --l2:#FFC24C; --l3:#FF6B5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:900;margin:4px 0 2px;letter-spacing:.5px}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
.sec{font-size:13px;color:var(--mute);letter-spacing:2px;margin:26px 0 10px;font-weight:700}
.course{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:block;width:100%;text-align:left}
.course .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#14161B}
.course h3{margin:0;font-size:19px}
.course .meta{color:var(--mute);font-size:13px;margin-left:auto}
.thumbs{display:flex;gap:6px;overflow:hidden}
.thumbs .t{background:#fff !important;flex:0 0 56px;height:42px;overflow:hidden;background:var(--card);border-radius:8px}
.thumbs svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.settings{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.seg{display:flex;background:#0F1115;border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--accent);color:#14161B;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left}
.ex .pic{background:#fff;border-radius:10px;aspect-ratio:4/3;overflow:hidden}
.ex b{display:block;margin:6px 4px 0;font-size:15px}
.ex small{display:block;margin:0 4px 2px;color:var(--mute);font-size:12px}
/* detail / course pages */
.back{color:var(--mute);font-size:15px;padding:6px 0;margin-bottom:6px}
.list .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.list .item .pic{flex:0 0 88px;height:66px;background:#fff;border-radius:9px;overflow:hidden}
.list .item svg{width:100%;height:100%;display:block}
.list .item b{font-size:16px;display:block}
.list .item small{color:var(--mute);font-size:13px}
.list .num{margin-left:auto;color:var(--accent);font-weight:900;font-size:15px;white-space:nowrap;padding-right:6px}
.big{display:block;width:100%;background:var(--accent);color:#14161B;font-weight:900;font-size:20px;border-radius:16px;padding:18px;margin-top:14px}
.stage{background:#fff;border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.cues{margin:14px 0 0;padding:0;list-style:none}
.cues li{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--line);font-size:16px}
.cues li:before{content:"";position:absolute;left:6px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700}
.yt i{width:26px;height:18px;background:#FF3B30;border-radius:5px;position:relative;display:inline-block}
.yt i:after{content:"";position:absolute;left:10px;top:4px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
/* workout */
#run{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#run.show{display:flex}
.rtop{display:flex;align-items:center;padding:12px 16px 6px;gap:10px}
.rtop .prog{flex:1;display:flex;gap:4px}
.rtop .prog span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.rtop .prog span.done{background:var(--accent)}
.rtop .prog span.cur{background:var(--accent2)}
.x{width:40px;height:40px;border-radius:12px;background:var(--panel);font-size:20px;color:var(--mute)}
.rbody{flex:1;display:flex;flex-direction:column;padding:6px 16px 12px;max-width:560px;width:100%;margin:0 auto;min-height:0}
.phase{font-size:14px;font-weight:700;letter-spacing:3px;color:var(--accent)}
.rname{font-size:34px;font-weight:900;line-height:1.15;margin:2px 0 8px}
.rname small{font-size:16px;color:var(--mute);font-weight:500;margin-left:6px}
.rstage{background:var(--card);border-radius:20px;overflow:hidden;flex:0 1 auto;aspect-ratio:4/3;max-height:50vh;background:#fff;min-height:150px;justify-content:center;display:flex;align-items:center;position:relative}
.lt{width:100%;height:100%}
.lt svg{display:block}
.ltfb{display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-weight:700}
.rstage .tag{position:absolute;left:12px;top:10px;background:#14161BCC;color:#fff;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}
.counter{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;gap:12px}
.beat{font-size:120px;line-height:.85;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text);min-width:1.1ch}
.beat.rest{color:var(--ok)}
.cinfo{flex:1;text-align:right}
.eight{font-size:22px;font-weight:900}
.eight small{color:var(--mute);font-weight:500;font-size:15px}
.dots{display:flex;gap:6px;justify-content:flex-end;margin:10px 0 8px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line);transition:transform .1s}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--accent2);transform:scale(1.25)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--accent);width:0}
.next{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:15px;margin-top:10px}
.next b{color:var(--text)}
.ctrls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto;padding-top:12px}
.ctrls button{background:var(--panel);border-radius:16px;padding:16px 0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.ctrls .pp{background:var(--accent);color:#14161B;font-size:19px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:8px;min-height:16px}
.done-screen{text-align:center;padding-top:40px}
.done-screen .ico{font-size:80px}
.vid{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;margin-bottom:10px;flex:0 0 auto}
.vid iframe,.vid>div{width:100%;height:100%;display:block}
#run:not(.withvideo) .vid{display:none}
#run.withvideo .rname{font-size:24px;margin-bottom:6px}
#run.withvideo .mid{display:flex;gap:12px;align-items:center}
#run.withvideo .rstage{flex:0 0 52%;max-height:none;min-height:0;aspect-ratio:auto;align-self:stretch}
#run.withvideo .mid{flex:1;min-height:120px}
#run.withvideo .beat{font-size:84px}
#run.withvideo .counter{flex:1;flex-direction:column;align-items:flex-end;margin-top:0}
#run.withvideo .dots i{width:12px;height:12px}
#run.withvideo .dots{gap:4px;margin:6px 0}
.pl{width:100%;background:#0F1115;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit;font-size:14px}
.plrow{flex-direction:column;align-items:stretch}
.plmsg{font-size:12px;color:var(--mute)}
#ytwrap{position:fixed;left:-10000px;top:0;width:320px;height:180px;z-index:20;border-radius:16px;overflow:hidden;background:#000}
#ytwrap iframe{width:100%;height:100%;display:block;border:0}
.ccard{display:flex;align-items:stretch;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.cbody{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:6px}
.ctext b{display:block;font-size:18px}.ctext small{color:var(--mute);font-size:13px}
.go{background:var(--accent);color:#14161B;font-weight:900;border-radius:12px;padding:0 18px;font-size:16px;white-space:nowrap}
.fold{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:12px;padding:0 14px}
.fold summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{color:var(--mute);font-weight:400;font-size:13px}
.fold summary:after{content:"▾";color:var(--mute);margin-left:8px}
.fold[open] summary:after{content:"▴"}
.fold .settings{border:0;padding:0;background:none}
.fold .grid{padding-bottom:14px}
.chead{display:flex;align-items:center;gap:10px}.chead h1{margin:0}
.ctarow{display:flex;gap:10px;margin:4px 0 6px}
.ctarow .big{margin:0;flex:1}
.reroll{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 14px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reroll small{font-size:11px;color:var(--mute)}
.mini{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.mini li{min-width:0;display:flex}
.mini li>button{height:100%}
.mini button{width:100%;display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:10px;padding:5px 8px 5px 5px;text-align:left}
.mini i{font-style:normal;color:var(--mute);font-size:12px;width:16px;text-align:center}
.mini .mpic{flex:0 0 auto;height:70%;min-height:30px;max-height:44px;aspect-ratio:4/3;background:#fff;border-radius:6px;overflow:hidden;display:block}
.mini b{font-size:13px;flex:1;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini em{font-style:normal;color:var(--accent);font-size:12px;font-weight:700}
.breath{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#EAFBF2,#fff 70%);container-type:size}
.breath .core,.breath .ring{position:absolute;border-radius:50%;animation:br 8s ease-in-out infinite}
.breath .core{width:min(68cqh,68cqw);height:min(68cqh,68cqw);background:#5BD49A}
.breath .ring{width:min(92cqh,92cqw);height:min(92cqh,92cqw);background:#5BD49A;opacity:.22;animation-delay:.15s}
@keyframes br{0%,100%{transform:scale(.72)}50%{transform:scale(1)}}
.breath span{position:relative;font-weight:900;font-size:max(18px,min(13cqh,13cqw));color:#0B3A25;letter-spacing:.15em;animation:bt 8s infinite}
.breath .bout{position:absolute;animation-delay:-4s}
@keyframes bt{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.hhead{display:flex;align-items:center;justify-content:space-between}
.svgi{width:1.15em;height:1.15em;fill:currentColor;display:block}
.ic{display:flex;align-items:center}
#app.wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.clist{flex:1;display:grid;grid-auto-rows:minmax(72px,1fr);gap:10px;margin-bottom:2px}
.clist .ccard{margin:0}
.ctext b{font-size:clamp(17px,2.6vh,24px)}.ctext small{font-size:clamp(13px,1.8vh,16px)}
.go{font-size:clamp(16px,2.4vh,22px)}
.cview{flex:1;display:flex;flex-direction:column}
.cright{flex:1;display:flex;flex-direction:column}
.mini{flex:1;grid-auto-rows:minmax(40px,1fr)}
#run:not(.withvideo) .mid{flex:1;display:flex;flex-direction:column;min-height:0}
#run:not(.withvideo) .rstage{flex:1 1 auto;aspect-ratio:auto;max-height:none;min-height:150px}
.bigcta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(84px,13vh,130px);font-size:clamp(22px,3.4vh,30px);margin:6px 0 4px;box-shadow:0 8px 24px #FF8A4C55}
.bigcta small{font-size:13px;font-weight:500;opacity:.75}
#app.fit{height:100vh;height:100dvh;min-height:0}
#app.fit .cview,#app.fit .cright{min-height:0}
.tiles{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(84px,1fr);gap:8px}
.tile{display:flex;flex-direction:column;background:var(--panel);border-radius:14px;padding:6px;min-height:0}
.tile .tpic{flex:1;min-height:50px;background:#fff;border-radius:10px;overflow:hidden;display:block}
.tile b{font-size:14px;padding:6px 2px 2px;text-align:center}
.lnote{display:none}
@media (orientation:landscape) and (max-height:600px){
  #run:not(.withvideo) .rbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto auto;column-gap:18px;max-width:none;padding:0 16px 12px}
  #run:not(.withvideo) .mid{display:contents}
  #run:not(.withvideo) .rstage{grid-column:1;grid-row:1/7;aspect-ratio:auto;height:100%;max-height:none;min-height:0}
  #run:not(.withvideo) .phase{grid-column:2;grid-row:1}
  #run:not(.withvideo) .rname{grid-column:2;grid-row:2;font-size:26px;margin:0}
  #run:not(.withvideo) .counter{grid-column:2;grid-row:3;margin:0;align-items:center}
  #run:not(.withvideo) .beat{font-size:80px}
  #run:not(.withvideo) .bar{grid-column:2;grid-row:4;margin-top:6px}
  #run:not(.withvideo) .next{grid-column:2;grid-row:5;margin-top:6px;font-size:13px}
  #run:not(.withvideo) .ctrls{grid-column:2;grid-row:6;margin-top:8px;padding:0}
  #run:not(.withvideo) .ctrls button{padding:10px 0}
  #run:not(.withvideo) .note{display:none}
  #run:not(.withvideo) .rtop{padding:8px 16px 6px}
  .wrap{max-width:920px;padding:10px 20px 20px}
  h1{font-size:22px}.sub{margin:0 0 8px;font-size:13px}
  .clist{grid-template-columns:1fr 1fr;gap:8px}
  .clist .ccard{margin:0;padding:6px}
  .ctext b{font-size:16px}
  .go{padding:0 14px}
  .fold{margin-top:8px}.fold summary{padding:10px 0}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(70px,1fr)}
  .cleft{display:flex;flex-direction:column;min-height:0}
  .cleft .back{align-self:flex-start}
  .cview{height:100%}
  .cleft .bigcta{flex:1;max-height:200px}
  .cview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:stretch}
  .cright .sec{margin-top:6px}
  .lnote{display:block;text-align:left}.pnote{display:none}
  .ctarow .big{padding:14px}
}
@media (orientation:landscape) and (max-height:600px){
  #run.withvideo{background:transparent;pointer-events:none}
  #run.withvideo button{pointer-events:auto}
  #run.withvideo .vid{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;margin:0;background:transparent}
  #run.withvideo .rtop{position:fixed;top:8px;left:12px;right:12px;z-index:2;padding:0}
  #run.withvideo .rbody{position:fixed;inset:0;max-width:none;padding:0}
  #run.withvideo .phase,#run.withvideo .rname{position:fixed;left:16px;text-shadow:0 2px 8px #000}
  #run.withvideo .phase{top:56px}
  #run.withvideo .rname{top:74px;font-size:28px}
  #run.withvideo .rstage .tag{font-size:11px;padding:2px 8px;top:6px;left:6px}
  #run.withvideo .cinfo{text-align:left}
  #run.withvideo .dots{justify-content:flex-start}
  #run.withvideo .mid{position:fixed;right:14px;bottom:16px;display:grid;grid-template-columns:auto auto;align-items:center;gap:8px 12px;background:#000000B0;border-radius:16px;padding:10px;pointer-events:auto}
  #run.withvideo .rstage{width:13vw;aspect-ratio:4/3;max-height:none;min-height:0;border-radius:10px}
  #run.withvideo .rstage .tag{display:none}
  #run.withvideo .counter{flex-direction:column;align-items:flex-start;margin:0;gap:0}
  #run.withvideo .beat{font-size:56px}
  #run.withvideo .eight{font-size:15px}#run.withvideo .eight small{font-size:12px}
  #run.withvideo .dots{margin:4px 0}#run.withvideo .dots i{width:10px;height:10px}
  #run.withvideo .ctrls{grid-column:1/3;display:flex;gap:8px;margin:0;padding:0}
  #run.withvideo .ctrls button{flex:1;background:#FFFFFF22;color:#fff;padding:8px 0;border-radius:10px;font-size:20px;line-height:1}
  #run.withvideo .ctrls .pp{background:var(--accent);color:#14161B}
  #run.withvideo .ctrls .tx{display:none}
  #run.withvideo .bar{position:fixed;left:0;right:0;bottom:0;margin:0;height:6px;border-radius:0}
  #run.withvideo .next,#run.withvideo .note{display:none}
}
@media (max-height:700px){.beat{font-size:88px}.rname{font-size:26px}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<div id="run">
  <div class="rtop"><button class="x" id="quit" aria-label="結束">✕</button><div class="prog" id="prog"></div></div>
  <div class="rbody">
    <div class="vid" id="vidbox"></div>
    <div class="phase" id="phase">準備</div>
    <div class="rname" id="rname"></div>
    <div class="mid"><div class="rstage" id="rstage"><div class="lt" id="rfig"></div><span class="tag" id="rtag" hidden></span></div>
    <div class="counter">
      <div class="beat" id="beat">5</div>
      <div class="cinfo">
        <div class="dots" id="dots"></div>
        <div class="eight" id="eight"></div>
      </div>
    </div></div>
    <div class="bar"><div id="barf"></div></div>
    <div class="next" id="next"></div>
    <div class="ctrls" id="ctrls">
      <button id="prev" aria-label="上一個"><span class="ic"><svg viewBox="0 0 24 24" class="svgi" aria-hidden="true"><rect x="4.5" y="5" width="3" height="14" rx="1"/><path d="M19.5 6.2v11.6a1 1 0 0 1-1.55.83L9.6 12.83a1 1 0 0 1 0-1.66l8.35-5.8a1 1 0 0 1 1.55.83z"/></svg></span><span class="tx">上一個</span></button>
      <button class="pp" id="pause" aria-label="暫停"><span class="ic"><svg viewBox="0 0 24 24" class="svgi" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span><span class="tx">暫停</span></button>
      <button id="skip" aria-label="跳過"><span class="tx">跳過</span><span class="ic"><svg viewBox="0 0 24 24" class="svgi" aria-hidden="true"><rect x="16.5" y="5" width="3" height="14" rx="1"/><path d="M4.5 6.2v11.6a1 1 0 0 0 1.55.83l8.35-5.8a1 1 0 0 0 0-1.66L6.05 5.37A1 1 0 0 0 4.5 6.2z"/></svg></span></button>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<div id="ytwrap"><div id="yt"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script>

const EX={

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQueue(c){
  const out=[];let t=5,bag=[];
  while(true){
    if(!bag.length){bag=shuffle(c.pool);if(out.length&&bag[0]===out[out.length-1][0])bag.push(bag.shift())}
    const id=bag[0],rest=out.length?restOf(c):0,left=TARGET-t-rest;
    let e=c.eights;
    while(e>1&&secOf(id,e)>left)e--;
    if(secOf(id,e)>left||left<20)break;
    bag.shift();out.push([id,e]);t+=rest+secOf(id,e);
  }
  return out;
}

function mountLottie(el,id,play){
  el.innerHTML='';
  if(!window.lottie){el.innerHTML=`<div class="ltfb">${NM(id)}</div>`;return null}
  const a=lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:!!play,path:'lottie/'+id+'.json',
    rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
  a.addEventListener('DOMLoaded',()=>{
    fitAnim(a,el,id);
    if(play){a.setSpeed(S.speed);a.goToAndPlay(0,true)} else a.goToAndStop(Math.floor(a.totalFrames*.35),true);
  });
  return a;
}
const FIT={};
function fitAnim(a,el,id){
  const svg=el.querySelector('svg'),g=svg&&svg.querySelector(':scope > g');if(!g)return;
  let box=FIT[id];
  if(!box){
    let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    for(let k=0;k<12;k++){
      a.goToAndStop(Math.floor(a.totalFrames*k/12),true);
      let b;try{b=g.getBBox()}catch(e){return}
      if(!b.width)continue;
      x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.width);y2=Math.max(y2,b.y+b.height);
    }
    if(x2<=x1)return;
    const p=Math.max(x2-x1,y2-y1)*.06;
    box=FIT[id]=[x1-p,y1-p,x2-x1+2*p,y2-y1+2*p].map(v=>Math.round(v));
  }
  svg.setAttribute('viewBox',box.join(' '));
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}

/* ---------- Audio & voice ---------- */
let AC=null;
function tone(f,d,v=.25,type='sine'){
  if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
const click=acc=>{if(S.click) tone(acc?1320:880,.07,acc?.35:.2,'square')};
const chime=()=>{tone(784,.25,.3);setTimeout(()=>tone(1046,.4,.3),160)};
let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){
  if(!S.voice) return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';if(zhVoice)u.voice=zhVoice;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- YouTube ---------- */
function parseYT(u){
  u=(u||'').trim(); if(!u) return null;
  const list=(u.match(/[?&]list=([\w-]+)/)||[])[1];
  const v=(u.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/)||[])[1]||(/^[\w-]{11}$/.test(u)?u:null);
  if(list) return {list,v};
  if(v) return {v};
  return {bad:true};
}
function plStatus(){const p=parseYT(S.pl);return !p?'不填就只播拍子和語音':p.bad?'⚠️ 看不懂這個網址，請貼 YouTube 播放清單或影片連結':p.list?'✓ 播放清單已設定，按開始訓練就會一起播放':'✓ 影片已設定，按開始訓練就會一起播放'}
let YTP=null,ytReady=false,ytKey='',ytOk=false,pendingPlay=false;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;buildPlayer()};
function buildPlayer(){
  const p=parseYT(S.pl);
  if(!ytReady||!p||p.bad){return}
  const key=JSON.stringify(p); if(YTP&&key===ytKey) return;
  ytKey=key;
  try{YTP&&YTP.destroy()}catch(e){}
  ytOk=false;if(!document.getElementById('yt')){const d=document.createElement('div');d.id='yt';$('#ytwrap').appendChild(d)}
  const pv={playsinline:1,rel:0,modestbranding:1,origin:location.origin};
  if(p.list){pv.listType='playlist';pv.list=p.list}
  const opt={width:'100%',height:'100%',playerVars:pv};if(p.v)opt.videoId=p.v;
  YTP=new YT.Player('yt',Object.assign(opt,{
    events:{onReady:()=>{ytOk=true;try{if(p.list&&S.shuffle)YTP.setShuffle(true)}catch(e){};if(pendingPlay&&R&&!R.paused){try{YTP.playVideo()}catch(e){}}pendingPlay=false},
    onError:()=>{$('#note').textContent='有影片不允許在外部網站播放，已跳到下一部';try{YTP.nextVideo()}catch(e){}}}}));
}

/* ---------- Runner ---------- */
let R=null;
function startCourse(c){
  stopPreview();
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
  try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  if(c.random&&c._ran)c.items=buildQueue(c);
  c._ran=true;
  const q=c.items.map(([id,e,sd])=>({id,e,sd}));
  R={c,q,i:0,phase:'prep',dur:5,t0:performance.now(),paused:false,pAt:0,last:-1};
  $('#run').classList.add('show');$('#run').classList.toggle('withvideo',videoOn()); document.body.style.overflow='hidden';
  $('#prog').innerHTML=q.map(()=>'<span></span>').join('');
  lockScreen();
  enter('prep');
  R.raf=requestAnimationFrame(frame);
}
function cur(){return R.q[R.i]}
function beatMs(it){return 60000/(EX[it.id].bpm*S.speed)}
function enter(ph){
  R.phase=ph;R.t0=performance.now();R.last=-1;
  const it=cur(),ex=EX[it.id],nm=NM(it.id);
  if(ph==='prep'){R.dur=5;say('準備。第一個動作，'+nm)}
  if(ph==='rest'){R.dur=restOf(R.c);chime();say('時間到，休息。下一個，'+nm)}
  if(ph==='work'){R.dur=it.e*8*beatMs(it)/1000;say('開始')}
  $('#dots').innerHTML='<i></i>'.repeat(8);
  [...$('#prog').children].forEach((s,k)=>s.className=k<R.i?'done':k===R.i?'cur':'');
  $('#phase').textContent=ph==='work'?`第 ${R.i+1} / ${R.q.length} 個動作`:ph==='rest'?'休息・下一個動作':'準備開始';
  $('#phase').style.color=ph==='work'?'var(--accent)':'var(--ok)';
  $('#rname').textContent=nm;
  const fig=ph==='rest'?'__rest':it.id;
  if(R.figId!==fig){stopPreview();R.anim=null;
    if(fig==='__rest'){$('#rfig').innerHTML='<div class="breath"><div class="ring"></div><div class="core"></div><span class="bin">吸氣</span><span class="bout">吐氣</span></div>'}
    else R.anim=mountLottie($('#rfig'),it.id,true);
    R.figId=fig}
  $('#rtag').hidden=ph==='work';$('#rtag').textContent=ph==='prep'?'第一個':'休息・深呼吸';
  const nx=R.q[R.i+1];
  $('#next').innerHTML=ph==='work'?(nx?`<span>下一個：<b>${NM(nx.id)}</b></span>`:'<b>最後一個動作！</b>')+`<span>${it.e} 個八拍</span>`:`<span>${ex.cues[0]}</span>`;
}
function advance(){
  if(R.phase==='prep'||R.phase==='rest') return enter('work');
  if(R.i<R.q.length-1){R.i++;return enter('rest')}
  finish();
}
function frame(now){
  if(!R) return;
  const it=cur(),ex=EX[it.id];
  const el=R.paused?R.pAt-R.t0:now-R.t0;
  const st=$('#rstage');
  let svgPose,beatF;
  if(R.phase==='work'){
    const bm=beatMs(it),total=it.e*8;
    beatF=el/bm;const b=Math.floor(beatF);
    if(b!==R.last&&b<total&&!R.paused){
      R.last=b;const n=b%8+1,eight=Math.floor(b/8)+1;
      click(n===1);
      if(n===1&&b>0) say(eight===it.e?'最後一個八拍':'第'+ZH[eight]+'個八拍');
      $('#beat').textContent=n;$('#beat').className='beat';
      [...$('#dots').children].forEach((d,k)=>d.className=k<n-1?'on':k===n-1?'now':'');
      $('#eight').innerHTML=`第 ${eight} <small>/ ${it.e} 個八拍</small>`;
    }
    $('#barf').style.width=Math.min(100,el/(total*bm)*100)+'%';
    if(el>=total*bm&&!R.paused) advance();
  }else{
    const left=Math.ceil(R.dur-el/1000);
    if(left!==R.last&&!R.paused){
      R.last=left;$('#beat').textContent=Math.max(left,0);$('#beat').className='beat rest';
      $('#eight').innerHTML=`<small>秒後開始</small>`;
      if(left<=3&&left>0) tone(660,.12,.3);
    }
    $('#barf').style.width=Math.min(100,el/(R.dur*1000)*100)+'%';
    beatF=el/beatMs(it)*.6;
    if(el>=R.dur*1000&&!R.paused) advance();
  }
  placeVideo();
  if(R) R.raf=requestAnimationFrame(frame);
}
function togglePause(){
  if(!R) return;
  if(!R.paused){R.paused=true;R.pAt=performance.now();$('#pause').innerHTML='<span class="ic"><svg viewBox="0 0 24 24" class="svgi" aria-hidden="true"><path d="M7 5.7v12.6a1 1 0 0 0 1.53.85l10.1-6.3a1 1 0 0 0 0-1.7L8.53 4.85A1 1 0 0 0 7 5.7z"/></svg></span><span class="tx">繼續</span>';try{R.anim&&R.anim.pause()}catch(e){};try{speechSynthesis.cancel()}catch(e){};if(S.vpause)try{YTP&&YTP.pauseVideo()}catch(e){}}
  else{R.t0+=performance.now()-R.pAt;R.paused=false;$('#pause').innerHTML='<span class="ic"><svg viewBox="0 0 24 24" class="svgi" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span><span class="tx">暫停</span>';try{R.anim&&R.anim.play()}catch(e){};if(S.vpause)try{YTP&&YTP.playVideo()}catch(e){}}
}
$('#pause').onclick=togglePause;
$('#skip').onclick=()=>{if(!R)return;if(R.paused)togglePause();advance()};
$('#prev').onclick=()=>{if(!R)return;if(R.paused)togglePause();if(R.phase==='work'&&performance.now()-R.t0>2000)return enter('work');if(R.i>0)R.i--;enter('work')};
$('#quit').onclick=()=>endRun(true);
function finish(){
  chime();say('完成！辛苦了');
  const c=R.c;endRun(false);$('#app').classList.remove('fit');
  $('#app').innerHTML=`<div class="done-screen"><div class="ico">🎉</div><h1>完成 ${c.name}</h1><p class="sub">${c.items.length} 個動作・約 ${fmt(courseSec(c))}</p>
  <button class="big" data-start="${c.id}">再來一次</button><button class="big" style="background:var(--panel);color:var(--text)" data-home>回首頁</button></div>`;
  document.querySelectorAll('[data-home]').forEach(b=>b.classList.add('back'));
  document.querySelector('.done-screen [data-home]').classList.remove('back');
  document.querySelector('.done-screen [data-home]').onclick=home;
}
function endRun(goBack){
  if(!R) return;cancelAnimationFrame(R.raf);const c=R.c;R=null;
  try{speechSynthesis.cancel()}catch(e){}
  try{wl&&wl.release()}catch(e){};wl=null;
  videoOff();pendingPlay=false;$('#run').classList.remove('show','withvideo');placeVideo();document.body.style.overflow='';
  if(goBack) courseView(c);
}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
